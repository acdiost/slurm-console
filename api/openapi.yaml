openapi: 3.0.3
info:
  title: Slurm Console API
  version: 0.19.0
  description: 平台密码/PAM/LDAP 认证和基础 RBAC。外部账户的业务请求复查 PAM account 策略或 LDAP 目录资格及唯一标识，服务不可用时返回 503。集群标识查询保留授权范围隔离，集群连接配置和控制器检测要求平台范围 platform.clusters.manage。
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: health
      summary: 检查应用数据库健康
      responses:
        "200":
          description: 数据库可访问
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [ok]
                  requestId:
                    type: string
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/me:
    get:
      operationId: currentUser
      summary: 查询活动平台用户及其实时权限
      security:
        - platformToken: []
      responses:
        "200":
          description: 本人的用户信息和权限，不包含密码、tokenKey 或 Slurm 凭据
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                  requestId:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/clusters:
    get:
      operationId: listClusters
      summary: 按 clusters.read 权限分页列出集群标识
      security:
        - platformToken: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - in: query
          name: perPage
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - {
            "name": "q",
            "in": "query",
            "schema": { "type": "string", "maxLength": 128 },
            "description": "名称、标识、描述的字面匹配，最多 128 个 Unicode 字符且 512 字节。",
          }
      responses:
        "200":
          description: 只包含已授权集群；未授权用户得到空列表
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId:
                    type: string
                  data:
                    type: object
                    required: [items, page, perPage, totalItems]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Cluster"
                      page:
                        type: integer
                      perPage:
                        type: integer
                      totalItems:
                        type: integer
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/cluster-fleet:
    {
      "get":
        {
          "operationId": "listClusterFleet",
          "summary": "按实时授权分页展示多集群连接、资源和作业",
          "description": "先授权过滤、计数和分页，再查询当前页。最多 4 个 worker，整页等待预算 15 秒；保留已完成结果，其他卡片 pending。节点和作业分别授权；未知或失败不填零。响应前授权变化返回 409，单集群配置变化丢弃对应卡片来源。所有查询参数不可重复。",
          "security": [{ "platformToken": [] }],
          "parameters":
            [
              {
                "name": "page",
                "in": "query",
                "schema":
                  {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 1000000,
                    "default": 1,
                  },
              },
              {
                "name": "perPage",
                "in": "query",
                "schema":
                  {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 24,
                    "default": 12,
                  },
              },
              {
                "name": "q",
                "in": "query",
                "schema": { "type": "string", "maxLength": 128 },
                "description": "名称、标识、描述的字面匹配，最多 128 个 Unicode 字符且 512 字节。",
              },
              {
                "name": "configuration",
                "in": "query",
                "schema":
                  {
                    "type": "string",
                    "enum": ["enabled", "disabled", "unconfigured"],
                  },
              },
              {
                "name": "sort",
                "in": "query",
                "schema":
                  {
                    "type": "string",
                    "enum": ["name", "slug"],
                    "default": "name",
                  },
              },
              {
                "name": "order",
                "in": "query",
                "schema":
                  {
                    "type": "string",
                    "enum": ["asc", "desc"],
                    "default": "asc",
                  },
              },
            ],
          "responses":
            {
              "200":
                {
                  "description": "当前页的逻辑连接，不对跨集群资源求和；未授权用户得到空列表。",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["data", "requestId"],
                              "properties":
                                {
                                  "data":
                                    {
                                      "$ref": "#/components/schemas/ClusterFleetPage",
                                    },
                                  "requestId": { "type": "string" },
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/Error" },
              "401": { "$ref": "#/components/responses/Error" },
              "403": { "$ref": "#/components/responses/Error" },
              "408": { "$ref": "#/components/responses/Error" },
              "409": { "$ref": "#/components/responses/Error" },
              "503": { "$ref": "#/components/responses/Error" },
            },
        },
    }
  /api/v1/clusters/{clusterId}:
    get:
      operationId: getCluster
      summary: 查询授权集群标识，要求对应集群的 clusters.read
      security:
        - platformToken: []
      parameters:
        - in: path
          name: clusterId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 授权集群的非敏感元数据
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    $ref: "#/components/schemas/Cluster"
                  requestId:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/collections/users/auth-with-password:
    post:
      operationId: login
      summary: 用户名或邮箱登录，按账户来源验证平台密码/PAM/LDAP，每 IP 每分钟最多 5 次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, password]
              properties:
                identity:
                  type: string
                  description: 平台邮箱或管理员已关联的系统/目录用户名，不自动创建平台账户；PAM 不允许 UID 0
                  minLength: 1
                  maxLength: 255
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
                  maxLength: 255
      responses:
        "200":
          $ref: "#/components/responses/NativeAuth"
        "400":
          $ref: "#/components/responses/NativeError"
        "403":
          $ref: "#/components/responses/NativeError"
        "429":
          $ref: "#/components/responses/NativeError"
        "503":
          $ref: "#/components/responses/NativeError"
  /api/collections/users/auth-refresh:
    post:
      operationId: refreshSession
      summary: PocketBase 原生令牌刷新，复查平台启用状态及外部账户资格/目录唯一标识
      security:
        - platformToken: []
      responses:
        "200":
          $ref: "#/components/responses/NativeAuth"
        "401":
          $ref: "#/components/responses/NativeError"
        "403":
          $ref: "#/components/responses/NativeError"
        "503":
          $ref: "#/components/responses/NativeError"
  /api/v1/cluster-connection-profiles:
    {
      "get":
        {
          "operationId": "listConnectionProfiles",
          "summary": "列出服务端批准的连接方式",
          "description": "要求活动用户及平台范围 platform.clusters.manage。结果不含凭据、用户名、凭据文件路径或原始上游响应。",
          "security": [{ "platformToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "成功；检测失败通过 lastProbe.status 表达",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["data", "requestId"],
                              "properties":
                                {
                                  "data":
                                    {
                                      "type": "array",
                                      "items":
                                        {
                                          "$ref": "#/components/schemas/ConnectionProfile",
                                        },
                                    },
                                  "requestId": { "type": "string" },
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/Error" },
              "401": { "$ref": "#/components/responses/Error" },
              "403": { "$ref": "#/components/responses/Error" },
              "404": { "$ref": "#/components/responses/Error" },
              "409": { "$ref": "#/components/responses/Error" },
              "503": { "$ref": "#/components/responses/Error" },
            },
        },
    }
  /api/v1/cluster-configurations:
    {
      "get":
        {
          "operationId": "listClusterConfigurations",
          "summary": "分页列出集群连接配置及上次检测结果",
          "description": "要求活动用户及平台范围 platform.clusters.manage。结果不含凭据、用户名、凭据文件路径或原始上游响应。",
          "security": [{ "platformToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "成功；检测失败通过 lastProbe.status 表达",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["data", "requestId"],
                              "properties":
                                {
                                  "data":
                                    {
                                      "type": "object",
                                      "required":
                                        [
                                          "items",
                                          "page",
                                          "perPage",
                                          "totalItems",
                                        ],
                                      "properties":
                                        {
                                          "items":
                                            {
                                              "type": "array",
                                              "items":
                                                {
                                                  "$ref": "#/components/schemas/ClusterConfiguration",
                                                },
                                            },
                                          "page": { "type": "integer" },
                                          "perPage": { "type": "integer" },
                                          "totalItems": { "type": "integer" },
                                        },
                                    },
                                  "requestId": { "type": "string" },
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/Error" },
              "401": { "$ref": "#/components/responses/Error" },
              "403": { "$ref": "#/components/responses/Error" },
              "404": { "$ref": "#/components/responses/Error" },
              "409": { "$ref": "#/components/responses/Error" },
              "503": { "$ref": "#/components/responses/Error" },
            },
          "parameters":
            [
              {
                "in": "query",
                "name": "page",
                "schema":
                  {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 1000000,
                    "default": 1,
                  },
              },
              {
                "in": "query",
                "name": "perPage",
                "schema":
                  {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 100,
                    "default": 20,
                  },
              },
            ],
        },
      "post":
        {
          "operationId": "createClusterConfiguration",
          "summary": "创建集群连接配置",
          "description": "要求活动用户及平台范围 platform.clusters.manage。结果不含凭据、用户名、凭据文件路径或原始上游响应。",
          "security": [{ "platformToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "成功；检测失败通过 lastProbe.status 表达",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["data", "requestId"],
                              "properties":
                                {
                                  "data":
                                    {
                                      "$ref": "#/components/schemas/ClusterConfiguration",
                                    },
                                  "requestId": { "type": "string" },
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/Error" },
              "401": { "$ref": "#/components/responses/Error" },
              "403": { "$ref": "#/components/responses/Error" },
              "404": { "$ref": "#/components/responses/Error" },
              "409": { "$ref": "#/components/responses/Error" },
              "503": { "$ref": "#/components/responses/Error" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "$ref": "#/components/schemas/ClusterConfigurationInput",
                        },
                    },
                },
            },
        },
    }
  /api/v1/cluster-configurations/{clusterId}:
    {
      "patch":
        {
          "operationId": "updateClusterConfiguration",
          "summary": "更新完整配置，revision 冲突返回 409",
          "description": "要求活动用户及平台范围 platform.clusters.manage。结果不含凭据、用户名、凭据文件路径或原始上游响应。",
          "security": [{ "platformToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "成功；检测失败通过 lastProbe.status 表达",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["data", "requestId"],
                              "properties":
                                {
                                  "data":
                                    {
                                      "$ref": "#/components/schemas/ClusterConfiguration",
                                    },
                                  "requestId": { "type": "string" },
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/Error" },
              "401": { "$ref": "#/components/responses/Error" },
              "403": { "$ref": "#/components/responses/Error" },
              "404": { "$ref": "#/components/responses/Error" },
              "409": { "$ref": "#/components/responses/Error" },
              "503": { "$ref": "#/components/responses/Error" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "$ref": "#/components/schemas/ClusterConfigurationInput",
                        },
                    },
                },
            },
          "parameters":
            [
              {
                "in": "path",
                "name": "clusterId",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
        },
    }
  /api/v1/cluster-configurations/{clusterId}/test:
    {
      "post":
        {
          "operationId": "testClusterConnection",
          "summary": "只读检测 REST 与控制器并持久化结果",
          "description": "要求活动用户及平台范围 platform.clusters.manage。结果不含凭据、用户名、凭据文件路径或原始上游响应。",
          "security": [{ "platformToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "成功；检测失败通过 lastProbe.status 表达",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["data", "requestId"],
                              "properties":
                                {
                                  "data":
                                    {
                                      "$ref": "#/components/schemas/ClusterConfiguration",
                                    },
                                  "requestId": { "type": "string" },
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/Error" },
              "401": { "$ref": "#/components/responses/Error" },
              "403": { "$ref": "#/components/responses/Error" },
              "404": { "$ref": "#/components/responses/Error" },
              "409": { "$ref": "#/components/responses/Error" },
              "503": { "$ref": "#/components/responses/Error" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    { "schema": { "$ref": "#/components/schemas/Revision" } },
                },
            },
          "parameters":
            [
              {
                "in": "path",
                "name": "clusterId",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
        },
    }
  /api/v1/cluster-configurations/{clusterId}/disable:
    {
      "post":
        {
          "operationId": "disableClusterConnection",
          "summary": "停用平台连接，保留标识与授权",
          "description": "要求活动用户及平台范围 platform.clusters.manage。结果不含凭据、用户名、凭据文件路径或原始上游响应。",
          "security": [{ "platformToken": [] }],
          "responses":
            {
              "200":
                {
                  "description": "成功；检测失败通过 lastProbe.status 表达",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["data", "requestId"],
                              "properties":
                                {
                                  "data":
                                    {
                                      "$ref": "#/components/schemas/ClusterConfiguration",
                                    },
                                  "requestId": { "type": "string" },
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/Error" },
              "401": { "$ref": "#/components/responses/Error" },
              "403": { "$ref": "#/components/responses/Error" },
              "404": { "$ref": "#/components/responses/Error" },
              "409": { "$ref": "#/components/responses/Error" },
              "503": { "$ref": "#/components/responses/Error" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    { "schema": { "$ref": "#/components/schemas/Revision" } },
                },
            },
          "parameters":
            [
              {
                "in": "path",
                "name": "clusterId",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
        },
    }
  /api/v1/clusters/{clusterId}/health:
    {
      "get":
        {
          "operationId": "slurmHealth",
          "summary": "查询 Slurm health",
          "description": "要求活动用户及对应集群的 clusters.read。固定受限身份访问 v0.0.43，只读，不自动重试。列表在 Go 中有界读取后分页；cached/fetchedAt 表达缓存来源及时间。",
          "security": [{ "platformToken": [] }],
          "parameters":
            [
              {
                "in": "path",
                "name": "clusterId",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
          "responses":
            {
              "200":
                {
                  "description": "统一 DTO，不包含原始上游敏感字段；healthy status 可为 controller_down",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "required": ["data", "requestId"],
                              "properties":
                                {
                                  "data":
                                    {
                                      "type": "object",
                                      "required":
                                        ["fetchedAt", "cached", "item"],
                                      "properties":
                                        {
                                          "fetchedAt":
                                            {
                                              "type": "string",
                                              "format": "date-time",
                                            },
                                          "cached": { "type": "boolean" },
                                          "item":
                                            {
                                              "$ref": "#/components/schemas/SlurmHealth",
                                            },
                                        },
                                    },
                                  "requestId": { "type": "string" },
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/Error" },
              "401": { "$ref": "#/components/responses/Error" },
              "403": { "$ref": "#/components/responses/Error" },
              "404": { "$ref": "#/components/responses/Error" },
              "408": { "$ref": "#/components/responses/Error" },
              "409": { "$ref": "#/components/responses/Error" },
              "429": { "$ref": "#/components/responses/Error" },
              "503": { "$ref": "#/components/responses/Error" },
            },
        },
    }
  /api/v1/clusters/{clusterId}/jobs:
    {
      "get":
        {
          "operationId": "slurmJobs",
          "summary": "查询 Slurm jobs",
          "description": "要求活动用户及对应集群的 jobs.read。固定受限身份访问 v0.0.43，只读，不自动重试。列表在 Go 中有界读取后分页；cached/fetchedAt 表达缓存来源及时间。",
          "security": [{ "platformToken": [] }],
          "parameters":
            [
              {
                "in": "path",
                "name": "clusterId",
                "required": true,
                "schema": { "type": "string" },
              },
              {
                "in": "query",
                "name": "page",
                "schema":
                  {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 1000000,
                    "default": 1,
                  },
              },
              {
                "in": "query",
                "name": "perPage",
                "schema":
                  {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 100,
                    "default": 20,
                  },
              },
              {
                "in": "query",
                "name": "q",
                "schema": { "type": "string", "maxLength": 128 },
              },
              {
                "in": "query",
                "name": "state",
                "schema": { "type": "string", "maxLength": 128 },
              },
              {
                "in": "query",
                "name": "user",
                "schema": { "type": "string", "maxLength": 128 },
              },
              {
                "in": "query",
                "name": "partition",
                "schema": { "type": "string", "maxLength": 255 },
              },
              {
                "in": "query",
                "name": "account",
                "schema": { "type": "string", "maxLength": 128 },
              },
              {
                "in": "query",
                "name": "qos",
                "schema": { "type": "string", "maxLength": 128 },
              },
              {
                "in": "query",
                "name": "sort",
                "schema":
                  {
                    "type": "string",
                    "enum": ["id", "submitTime", "cpus"],
                    "default": "id",
                  },
              },
