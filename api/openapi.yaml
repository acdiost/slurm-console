openapi: 3.0.3
info:
  title: Slurm Console API
  version: 0.3.0
  description: 平台密码/PAM 认证和基础 RBAC。PAM 账户的业务请求复查系统 account 策略，服务不可用时返回 503。集群接口当前只提供授权范围内的标识信息，尚未连接 Slurm。
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      operationId: health
      summary: 检查应用数据库健康
      responses:
        '200':
          description: 数据库可访问
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [ok]
                  requestId:
                    type: string
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/me:
    get:
      operationId: currentUser
      summary: 查询活动平台用户及其实时权限
      security:
        - platformToken: []
      responses:
        '200':
          description: 本人的用户信息和权限，不包含密码、tokenKey 或 Slurm 凭据
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  requestId:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/clusters:
    get:
      operationId: listClusters
      summary: 按 clusters.read 权限分页列出集群标识
      security:
        - platformToken: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - in: query
          name: perPage
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 只包含已授权集群；未授权用户得到空列表
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId:
                    type: string
                  data:
                    type: object
                    required: [items, page, perPage, totalItems]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Cluster'
                      page:
                        type: integer
                      perPage:
                        type: integer
                      totalItems:
                        type: integer
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/clusters/{clusterId}:
    get:
      operationId: getCluster
      summary: 查询授权集群标识，要求对应集群的 clusters.read
      security:
        - platformToken: []
      parameters:
        - in: path
          name: clusterId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 授权集群的非敏感元数据
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    $ref: '#/components/schemas/Cluster'
                  requestId:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/collections/users/auth-with-password:
    post:
      operationId: login
      summary: 用户名或邮箱登录，按账户来源验证平台密码或 PAM，每 IP 每分钟最多 5 次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, password]
              properties:
                identity:
                  type: string
                  description: 平台邮箱或管理员已关联的非 root 系统用户名，不自动创建平台账户
                  minLength: 1
                  maxLength: 255
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 1
                  maxLength: 255
      responses:
        '200':
          $ref: '#/components/responses/NativeAuth'
        '400':
          $ref: '#/components/responses/NativeError'
        '403':
          $ref: '#/components/responses/NativeError'
        '429':
          $ref: '#/components/responses/NativeError'
        '503':
          $ref: '#/components/responses/NativeError'
  /api/collections/users/auth-refresh:
    post:
      operationId: refreshSession
      summary: PocketBase 原生令牌刷新，复查平台启用状态和 PAM account 策略
      security:
        - platformToken: []
      responses:
        '200':
          $ref: '#/components/responses/NativeAuth'
        '401':
          $ref: '#/components/responses/NativeError'
        '403':
          $ref: '#/components/responses/NativeError'
        '503':
          $ref: '#/components/responses/NativeError'
components:
  securitySchemes:
    platformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 平台 users 集合的 PocketBase 令牌，不是 Slurm JWT；无服务端 logout，会话退出由 SDK 清除令牌。
  headers:
    RequestId:
      description: 服务器生成的请求标识
      schema:
        type: string
  responses:
    Error:
      description: 平台错误响应，Cache-Control 为 no-store
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            type: object
            required: [error, requestId]
            properties:
              requestId:
                type: string
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    enum: [BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, RATE_LIMITED, UNAVAILABLE, INTERNAL_ERROR]
                  message:
                    type: string
    NativeError:
      description: 保留 PocketBase 原生错误格式供官方 SDK 使用
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              data:
                type: object
    NativeAuth:
      description: PocketBase 原生认证响应，令牌有效期一小时
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            type: object
            required: [token, record]
            properties:
              token:
                type: string
              record:
                type: object
                description: PocketBase users 的公开字段，不包含密码哈希和 tokenKey
  schemas:
    Cluster:
      type: object
      required: [id, name, slug, description]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
    Access:
      type: object
      required: [platformRoles, platformPermissions, clusters]
      properties:
        platformRoles:
          type: array
          items:
            type: string
        platformPermissions:
          type: array
          items:
            type: string
          description: 平台范围动作；其中集群动作适用于所有集群
        clusters:
          type: array
          items:
            type: object
            required: [cluster, roles, permissions]
            properties:
              cluster:
                $ref: '#/components/schemas/Cluster'
              roles:
                type: array
                items:
                  type: string
              permissions:
                type: array
                items:
                  type: string
    User:
      type: object
      required: [id, email, name, username, authSource, access]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        username:
          type: string
          description: PAM 系统用户名，本地账户为空字符串
        authSource:
          type: string
          enum: [local, pam]
        access:
          $ref: '#/components/schemas/Access'
