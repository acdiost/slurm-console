components:
  securitySchemes:
    platformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 平台 users 集合的 PocketBase 令牌，不是 Slurm JWT；无服务端 logout，会话退出由 SDK 清除令牌。
  headers:
    RequestId:
      description: 服务器生成的请求标识
      schema:
        type: string
  responses:
    Error:
      description: 平台错误响应，Cache-Control 为 no-store
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            type: object
            required: [error, requestId]
            properties:
              requestId:
                type: string
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    enum:
                      [
                        BAD_REQUEST,
                        UNAUTHENTICATED,
                        FORBIDDEN,
                        NOT_FOUND,
                        METHOD_NOT_ALLOWED,
                        CONFLICT,
                        RATE_LIMITED,
                        UNAVAILABLE,
                        INTERNAL_ERROR,
                        REQUEST_TIMEOUT,
                        SLURM_NOT_FOUND,
                        SLURM_INVALID_REQUEST,
                        SLURM_DISABLED,
                        SLURM_CONFIGURATION_CHANGED,
                        SLURM_BUSY,
                        SLURM_TIMEOUT,
                        SLURM_TLS_FAILED,
                        SLURM_AUTH_FAILED,
                        SLURM_API_UNSUPPORTED,
                        SLURM_INVALID_RESPONSE,
                        SLURM_UPSTREAM_ERROR,
                        SLURM_PROFILE_UNAVAILABLE,
                        SLURM_CREDENTIALS_UNAVAILABLE,
                        SLURM_UNREACHABLE,
                      ]
                  message:
                    type: string
    NativeError:
      description: 保留 PocketBase 原生错误格式供官方 SDK 使用
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              data:
                type: object
    NativeAuth:
      description: PocketBase 原生认证响应，令牌有效期一小时
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            type: object
            required: [token, record]
            properties:
              token:
                type: string
              record:
                type: object
                description: PocketBase users 的公开字段，不包含密码哈希和 tokenKey
  schemas:
    Cluster:
      type: object
      required: [id, name, slug, description]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
    Access:
      type: object
      required: [platformRoles, platformPermissions, clusters]
      properties:
        platformRoles:
          type: array
          items:
            type: string
        platformPermissions:
          type: array
          items:
            type: string
          description: 平台范围动作；其中集群动作适用于所有集群
        clusters:
          type: array
          items:
            type: object
            required: [cluster, roles, permissions]
            properties:
              cluster:
                $ref: "#/components/schemas/Cluster"
              roles:
                type: array
                items:
                  type: string
              permissions:
                type: array
                items:
                  type: string
    User:
      type: object
      required: [id, email, name, username, authSource, access]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        username:
          type: string
          description: PAM/LDAP 外部用户名，本地账户为空字符串
        authSource:
          type: string
          enum: [local, pam, ldap]
        access:
          $ref: "#/components/schemas/Access"

    ClusterConfigurationInput:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "name",
            "slug",
            "description",
            "connectionRef",
            "apiVersion",
            "enabled",
            "timeoutSeconds",
            "revision",
          ],
        "properties":
          {
            "name": { "type": "string", "minLength": 2, "maxLength": 100 },
            "slug":
              {
                "type": "string",
                "maxLength": 64,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "description": "创建后不可修改",
              },
            "description": { "type": "string", "maxLength": 1000 },
            "connectionRef":
              {
                "type": "string",
                "description": "服务端批准的引用，不接受任意 endpoint 或凭据",
              },
            "apiVersion":
              {
                "type": "string",
                "enum": ["v0.0.41", "v0.0.42", "v0.0.43", "v0.0.44"],
              },
            "enabled": { "type": "boolean" },
            "timeoutSeconds":
              { "type": "integer", "minimum": 1, "maximum": 30 },
            "revision":
              {
                "type": "integer",
                "minimum": 0,
                "description": "新建为 0，修改使用上次读取的版本",
              },
          },
      }
    Revision:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["revision"],
        "properties": { "revision": { "type": "integer", "minimum": 0 } },
      }
    ConnectionProfile:
      {
        "type": "object",
        "required": ["ref", "label", "endpoint", "authType", "apiVersions"],
        "properties":
          {
            "ref": { "type": "string" },
            "label": { "type": "string" },
            "endpoint":
              {
                "type": "string",
                "description": "已批准的 HTTPS origin 或绝对 Unix socket URL",
              },
            "authType": { "type": "string", "enum": ["local", "jwt"] },
            "apiVersions": { "type": "array", "items": { "type": "string" } },
          },
      }
    ProbeResult:
      {
        "type": "object",
        "required":
          [
            "status",
            "message",
            "checkedAt",
            "durationMs",
            "serverVersion",
            "controllers",
          ],
        "properties":
          {
            "status":
              {
                "type": "string",
                "enum":
                  [
                    "not_tested",
                    "connected",
                    "unreachable",
                    "timeout",
                    "tls_failed",
                    "auth_failed",
                    "api_unsupported",
                    "invalid_response",
                    "controller_down",
                    "credentials_unavailable",
                    "profile_unavailable",
                  ],
              },
            "message": { "type": "string" },
            "checkedAt":
              {
                "type": "string",
                "description": "RFC3339 检测结束时间，未检测为空",
              },
            "durationMs": { "type": "integer", "minimum": 0 },
            "serverVersion":
              {
                "type": "string",
                "description": "RESTD 元数据版本，未检测为空",
              },
            "controllers":
              {
                "type": "array",
                "items":
                  {
                    "type": "object",
                    "required": ["hostname", "state", "role"],
                    "properties":
                      {
                        "hostname": { "type": "string" },
                        "state": { "type": "string", "enum": ["UP", "DOWN"] },
                        "role": { "type": "string" },
                      },
                  },
              },
          },
      }
    ClusterConfiguration:
      {
        "type": "object",
        "required":
          [
            "name",
            "slug",
            "description",
            "connectionRef",
            "apiVersion",
            "enabled",
            "timeoutSeconds",
            "revision",
            "id",
            "endpoint",
            "authType",
            "profileAvailable",
            "lastProbe",
          ],
        "properties":
          {
            "name": { "type": "string", "minLength": 2, "maxLength": 100 },
            "slug":
              {
                "type": "string",
                "maxLength": 64,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "description": "创建后不可修改",
              },
            "description": { "type": "string", "maxLength": 1000 },
            "connectionRef":
              {
                "type": "string",
                "description": "服务端批准的引用，不接受任意 endpoint 或凭据",
              },
            "apiVersion":
              {
                "type": "string",
                "enum": ["v0.0.41", "v0.0.42", "v0.0.43", "v0.0.44"],
              },
            "enabled": { "type": "boolean" },
            "timeoutSeconds":
              { "type": "integer", "minimum": 1, "maximum": 30 },
            "revision":
              {
                "type": "integer",
                "minimum": 0,
                "description": "新建为 0，修改使用上次读取的版本",
              },
            "id": { "type": "string" },
            "endpoint": { "type": "string" },
            "authType": { "type": "string", "enum": ["", "local", "jwt"] },
            "profileAvailable": { "type": "boolean" },
            "lastProbe": { "$ref": "#/components/schemas/ProbeResult" },
          },
      }

    SlurmNumber:
      {
        "type": "object",
        "required": ["value", "infinite"],
        "properties":
          {
            "value":
              {
                "type": "integer",
                "format": "int64",
                "nullable": true,
                "minimum": 0,
              },
            "infinite": { "type": "boolean" },
          },
      }
    SlurmJob:
      {
        "type": "object",
        "required":
          [
            "id",
            "name",
            "user",
            "account",
            "partition",
            "reason",
            "nodes",
            "states",
            "cpus",
            "nodeCount",
            "timeLimitMinutes",
            "submitTime",
            "startTime",
            "endTime",
            "arrayJobId",
            "arrayTaskId",
            "userId",
            "restartCount",
            "qos",
            "arrayTaskString",
            "hetJobIdSet",
            "priority",
            "memoryPerNodeMiB",
            "memoryPerCpuMiB",
            "hetJobId",
            "hetJobOffset",
          ],
        "properties":
          {
            "id": { "type": "string", "pattern": "^[1-9][0-9]*$" },
            "name": { "type": "string" },
            "user": { "type": "string" },
            "account": { "type": "string" },
            "partition": { "type": "string" },
            "reason": { "type": "string" },
            "nodes": { "type": "string" },
            "states":
              { "type": "array", "minItems": 1, "items": { "type": "string" } },
            "cpus": { "$ref": "#/components/schemas/SlurmNumber" },
            "nodeCount": { "$ref": "#/components/schemas/SlurmNumber" },
            "timeLimitMinutes": { "$ref": "#/components/schemas/SlurmNumber" },
            "submitTime": { "$ref": "#/components/schemas/SlurmNumber" },
            "startTime": { "$ref": "#/components/schemas/SlurmNumber" },
            "endTime": { "$ref": "#/components/schemas/SlurmNumber" },
            "arrayJobId": { "$ref": "#/components/schemas/SlurmNumber" },
            "arrayTaskId": { "$ref": "#/components/schemas/SlurmNumber" },
            "userId":
              {
                "type": "integer",
                "format": "int64",
                "nullable": true,
                "minimum": 0,
              },
            "restartCount":
              {
                "type": "integer",
                "format": "int64",
                "nullable": true,
                "minimum": 0,
              },
            "qos": { "type": "string" },
            "arrayTaskString": { "type": "string" },
            "hetJobIdSet": { "type": "string" },
            "priority": { "$ref": "#/components/schemas/SlurmNumber" },
            "memoryPerNodeMiB": { "$ref": "#/components/schemas/SlurmNumber" },
            "memoryPerCpuMiB": { "$ref": "#/components/schemas/SlurmNumber" },
            "hetJobId": { "$ref": "#/components/schemas/SlurmNumber" },
            "hetJobOffset": { "$ref": "#/components/schemas/SlurmNumber" },
          },
      }
    SlurmNode:
      {
        "type": "object",
        "required":
          [
            "name",
            "hostname",
            "reason",
            "gres",
            "states",
            "cpus",
            "allocatedCpus",
            "memoryMiB",
            "allocatedMemoryMiB",
            "freeMemoryMiB",
            "partitions",
            "effectiveCpus",
            "gresUsed",
            "address",
            "version",
            "architecture",
            "operatingSystem",
            "comment",
            "reservation",
            "reasonUser",
            "features",
            "activeFeatures",
            "bootTime",
            "slurmdStartTime",
            "reasonChangedAt",
            "resumeAfter",
            "resources",
          ],
        "properties":
          {
            "name": { "type": "string" },
            "hostname": { "type": "string" },
            "reason": { "type": "string" },
            "gres": { "type": "string" },
            "states":
              { "type": "array", "minItems": 1, "items": { "type": "string" } },
            "cpus": { "type": "integer", "format": "int64", "minimum": 0 },
            "allocatedCpus":
              { "type": "integer", "format": "int64", "minimum": 0 },
            "memoryMiB": { "type": "integer", "format": "int64", "minimum": 0 },
            "allocatedMemoryMiB":
              { "type": "integer", "format": "int64", "minimum": 0 },
            "freeMemoryMiB": { "$ref": "#/components/schemas/SlurmNumber" },
            "partitions": { "type": "array", "items": { "type": "string" } },
            "effectiveCpus":
              { "type": "integer", "format": "int64", "minimum": 0 },
            "gresUsed": { "type": "string" },
            "address": { "type": "string" },
            "version": { "type": "string" },
            "architecture": { "type": "string" },
            "operatingSystem": { "type": "string" },
            "comment": { "type": "string" },
            "reservation": { "type": "string" },
            "reasonUser": { "type": "string" },
            "features": { "type": "array", "items": { "type": "string" } },
            "activeFeatures":
              { "type": "array", "items": { "type": "string" } },
            "bootTime": { "$ref": "#/components/schemas/SlurmNumber" },
            "slurmdStartTime": { "$ref": "#/components/schemas/SlurmNumber" },
            "reasonChangedAt": { "$ref": "#/components/schemas/SlurmNumber" },
            "resumeAfter": { "$ref": "#/components/schemas/SlurmNumber" },
            "resources":
              {
                "type": "object",
                "required": ["cpus", "memoryMiB", "gpus"],
                "properties":
                  {
                    "cpus":
                      {
                        "type": "object",
                        "required":
                          ["total", "allocated", "idle", "unavailable"],
                        "properties":
