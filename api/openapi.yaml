  /api/v1/clusters/{clusterId}/metrics/gpu/{uuid}/history:
    {
      "get": {
        "operationId": "getGPUHistory",
        "summary": "读取已识别物理GPU的固定窗口趋势",
        "description": "需要metrics.read；node+UUID必须在当前来源快照中且无身份冲突。1h/6h/24h对应60/300/600秒步长。固定last_over_time(...[60s])，不使用默认五分钟向前填充；缺失时点保留null。趋势30秒缓存，返回前复查授权与集群版本。不存在/未配置404，来源故障503。",
        "security": [
          {
            "platformToken": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "clusterId",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "path",
            "name": "uuid",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^GPU-[a-zA-Z0-9-]{1,100}$"
            }
          },
          {
            "in": "query",
            "name": "node",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "range",
            "schema": {
              "type": "string",
              "enum": [
                "1h",
                "6h",
                "24h"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "成功；Cache-Control 为 no-store",
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data",
                    "requestId"
                  ],
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/GPUHistory"
                    },
                    "requestId": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
