components:
  securitySchemes:
    platformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 平台 users 集合的 PocketBase 令牌，不是 Slurm JWT；无服务端 logout，会话退出由 SDK 清除令牌。
  headers:
    RequestId:
      description: 服务器生成的请求标识
      schema:
        type: string
  responses:
    Error:
      description: 平台错误响应，Cache-Control 为 no-store
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            type: object
            required: [error, requestId]
            properties:
              requestId:
                type: string
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    enum:
                      [
                        BAD_REQUEST,
                        UNAUTHENTICATED,
                        FORBIDDEN,
                        NOT_FOUND,
                        METHOD_NOT_ALLOWED,
                        CONFLICT,
                        RATE_LIMITED,
                        UNAVAILABLE,
                        INTERNAL_ERROR,
                        REQUEST_TIMEOUT,
                        SLURM_NOT_FOUND,
                        SLURM_INVALID_REQUEST,
                        SLURM_DISABLED,
                        SLURM_CONFIGURATION_CHANGED,
                        SLURM_BUSY,
                        SLURM_TIMEOUT,
                        SLURM_TLS_FAILED,
                        SLURM_AUTH_FAILED,
                        SLURM_API_UNSUPPORTED,
                        SLURM_INVALID_RESPONSE,
                        SLURM_UPSTREAM_ERROR,
                        SLURM_PROFILE_UNAVAILABLE,
                        SLURM_CREDENTIALS_UNAVAILABLE,
                        SLURM_UNREACHABLE,
                        SLURM_ACCOUNTING_UNAVAILABLE,
                        SLURM_OPERATION_REJECTED,
                        SLURM_OPERATION_FORBIDDEN,
                        SLURM_CONFIRMATION_INVALID,
                        SLURM_CONFIRMATION_EXPIRED,
                        SLURM_CONFIRMATION_CHANGED,
                        SLURM_AUDIT_UNAVAILABLE,
                      ]
                  message:
                    type: string
    NativeError:
      description: 保留 PocketBase 原生错误格式供官方 SDK 使用
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              data:
                type: object
    NativeAuth:
      description: PocketBase 原生认证响应，令牌有效期一小时
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            type: object
            required: [token, record]
            properties:
              token:
                type: string
              record:
                type: object
                description: PocketBase users 的公开字段，不包含密码哈希和 tokenKey
  schemas:
    Cluster:
      type: object
      required: [id, name, slug, description]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
    Access:
      type: object
      required: [platformRoles, platformPermissions, clusters]
      properties:
        platformRoles:
          type: array
          items:
            type: string
        platformPermissions:
          type: array
          items:
            type: string
          description: 平台范围动作；其中集群动作适用于所有集群
        clusters:
          type: array
          items:
            type: object
            required: [cluster, roles, permissions]
            properties:
              cluster:
                $ref: "#/components/schemas/Cluster"
              roles:
                type: array
                items:
                  type: string
              permissions:
                type: array
                items:
                  type: string
    User:
      type: object
      required: [id, email, name, username, authSource, access]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        username:
          type: string
          description: PAM/LDAP 外部用户名，本地账户为空字符串
        authSource:
          type: string
          enum: [local, pam, ldap]
        access:
          $ref: "#/components/schemas/Access"

    ClusterConfigurationInput:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "name",
            "slug",
            "description",
            "connectionRef",
            "apiVersion",
            "enabled",
            "timeoutSeconds",
            "revision",
          ],
        "properties":
          {
            "name": { "type": "string", "minLength": 2, "maxLength": 100 },
            "slug":
              {
                "type": "string",
                "maxLength": 64,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "description": "创建后不可修改",
              },
            "description": { "type": "string", "maxLength": 1000 },
            "connectionRef":
              {
                "type": "string",
                "description": "服务端批准的引用，不接受任意 endpoint 或凭据",
              },
            "apiVersion":
              {
                "type": "string",
                "enum": ["v0.0.41", "v0.0.42", "v0.0.43", "v0.0.44"],
              },
            "enabled": { "type": "boolean" },
            "timeoutSeconds":
              { "type": "integer", "minimum": 1, "maximum": 30 },
            "revision":
              {
                "type": "integer",
                "minimum": 0,
                "description": "新建为 0，修改使用上次读取的版本",
              },
          },
      }
