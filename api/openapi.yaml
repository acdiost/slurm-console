  /api/v1/operation-audits:
    {
      "get":
        {
          "operationId": "listOperationAudits",
          "summary": "检索平台操作审计",
          "description": "要求活动用户及平台范围platform.audit.read，每次重新解析授权。可以检索停用或删除集群的历史；不授予当前资源权限。拒绝未知、重复和非法查询参数。",
          "security": [{ "platformToken": [] }],
          "parameters":
            [
              {
                "in": "query",
                "name": "page",
