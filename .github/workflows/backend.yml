name: Backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: bash -n ../deploy/install.sh ../deploy/setup-pam.sh ../deploy/setup-linux-users.sh ../deploy/cleanup-sudoers.sh
      - run: go mod verify
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: go vet ./...
      # Full API tests initialize isolated databases and exceed Go's default 10m on CI.
      - run: go test -race -timeout 20m ./...
      - run: go build ./...
      - name: Verify root process drops Unix socket credentials
        run: |
          go test -c -o /tmp/slurm-client.test ./internal/slurm/client
          sudo /tmp/slurm-client.test -test.run '^TestRootLocalSocketIdentity$' -test.v
          rm /tmp/slurm-client.test
